name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Das CUDA-Toolkit wird zum Uebersetzen gebraucht, eine GPU nicht: die Tests mit
# der Marke "host" laufen im CPU-Modus (siehe tests/README.md).
env:
  CUDA_TOOLCHAIN_PACKAGES: cmake make g++-12 nvidia-cuda-toolkit
  # apt ohne Rueckfragen: ein Paket, das auf Eingabe wartet, haengt sonst ewig
  DEBIAN_FRONTEND: noninteractive

jobs:
  host-tests:
    name: Host-Tests (ohne GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain installieren
        timeout-minutes: 35
        run: .github/scripts/apt-install.sh $CUDA_TOOLCHAIN_PACKAGES
      - name: Konfigurieren
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=g++-12
          -DFEMBEM_CUDA_HOST_COMPILER=/usr/bin/g++-12
          -DFEMBEM_CUDA_ARCH=75
      - name: Host-Tests bauen
        run: cmake --build build --target host_tests -j"$(nproc)"
      - name: Host-Tests ausfuehren
        run: ctest --test-dir build -L host --output-on-failure

  solver-build:
    name: Hauptprogramm bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain installieren
        timeout-minutes: 35
        run: .github/scripts/apt-install.sh $CUDA_TOOLCHAIN_PACKAGES
      - name: Konfigurieren (ohne Tests)
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=g++-12
          -DFEMBEM_CUDA_HOST_COMPILER=/usr/bin/g++-12
          -DFEMBEM_CUDA_ARCH=75
          -DFEMBEM_BUILD_TESTS=OFF
      - name: Bauen
        run: cmake --build build --target fembem -j"$(nproc)"
      - name: Startet ohne GPU
        run: ./build/fembem --help

  tools:
    name: Python-Werkzeuge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax pruefen
        run: python3 -m compileall -q tools tests
      - name: Spulenzuordnung des Standardnetzes
        run: |
          python3 -m pip install numpy
          python3 tools/check_map.py data/team28/team28.vtk

  docs:
    name: Dokumentation (LaTeX)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: TeX installieren
        timeout-minutes: 35
        run: >
          .github/scripts/apt-install.sh latexmk texlive-latex-extra
          texlive-latex-recommended texlive-fonts-recommended texlive-science
          texlive-pictures texlive-lang-german
      - name: Uebersetzen
        run: make -C docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: docs/_build/**/*.pdf
